[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pukara"
dynamic = ["version"]
description = "Privacy-first encrypted gateway for Ollama with on-device pseudonymisation (Spanish clinical text)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ramsés Marrero García" },
    { name = "Petter Axcell Peñafiel" },
    { name = "Rosalía Cayuela" },
    { name = "Clara Brunet" }
]
keywords = ["ollama", "encryption", "anonymization", "privacy", "llm", "spanish", "clinical"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cryptography>=42.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
client = [
    "torch>=2.1",
    "transformers>=4.40",
    "huggingface_hub>=0.23",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pip-audit>=2.7",
]

[project.scripts]
pukara-keygen = "src.keygen:main"
pukara-proxy = "src.proxy:main"
pukara-client = "src.client:main"

[project.urls]
Repository = "https://github.com/ramsestein/pukara"

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "eval*"]

[tool.setuptools.package-data]
src = ["*.txt"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
