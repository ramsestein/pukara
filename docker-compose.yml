services:
  ollama:
    build: .
    container_name: llm-propio-ollama
    ports:
      - "8000:8000"                    # encrypted proxy (public face)
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}
      BERT_MODEL: ${BERT_MODEL:-BSC-NLP4BIA/bsc-bio-ehr-es-carmen-anon}
      OLLAMA_KEEP_ALIVE: "-1"
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Define ENCRYPTION_SECRET en .env}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in .env}
      ALLOWED_IPS: ${ALLOWED_IPS:?Set ALLOWED_IPS in .env}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      RATE_LIMIT: ${RATE_LIMIT:-60}
      MAX_RATE_IPS: ${MAX_RATE_IPS:-100000}
      AUDIT_LOG: ${AUDIT_LOG:-}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-10485760}
      UPSTREAM_TIMEOUT: ${UPSTREAM_TIMEOUT:-600}
      MAX_SKEW: ${MAX_SKEW:-120}
      REPLAY_TTL: ${REPLAY_TTL:-300}
      REPLAY_MAX_ENTRIES: ${REPLAY_MAX_ENTRIES:-100000}
      ALLOW_MANAGEMENT: ${ALLOW_MANAGEMENT:-0}
      STRICT: ${STRICT:-1}
      PROXY_PORT: "8000"
    volumes:
      - ollama-data:/home/app/.ollama
    # ── Hardening ──────────────────────────────────────────────────────────
    read_only: true                    # read-only filesystem
    tmpfs:
      - /tmp                           # Ollama needs a writable /tmp
    cap_drop:
      - ALL                            # drop kernel capabilities
    security_opt:
      - no-new-privileges:true
    cpus: "1.0"
    mem_limit: "4g"
    pids_limit: 256
    restart: unless-stopped

volumes:
  ollama-data:
